<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phone Detector</title>
  <style>
    :root { color-scheme: dark; --accent: #55d6be; --card: #172235; --ink: #f5f8ff; --muted: #aab8cf; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Inter, Arial, sans-serif; background: radial-gradient(circle at top, #263c62, #0b1120 58%); color: var(--ink); }
    main { width: min(92vw, 650px); margin: 32px auto; text-align: center; }
    h1 { margin-bottom: 8px; font-size: clamp(2rem, 6vw, 3.4rem); }
    .intro { color: var(--muted); margin: 0 auto 24px; line-height: 1.5; }
    #camera { display: none; width: 100%; border-radius: 18px; transform: scaleX(-1); background: #050910; }
    .card { background: color-mix(in srgb, var(--card) 92%, transparent); padding: 20px; border-radius: 18px; box-shadow: 0 18px 45px #0007; }
    button { border: 0; border-radius: 999px; padding: 13px 22px; font-weight: 700; font-size: 1rem; background: var(--accent); color: #08211d; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 24px; margin: 14px 0 0; color: var(--muted); }
    #result { display: none; margin-top: 16px; text-align: left; }
    .row { margin: 12px 0; }
    .label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; text-transform: capitalize; }
    .track { height: 12px; overflow: hidden; border-radius: 30px; background: #273650; }
    .bar { height: 100%; width: 0; background: linear-gradient(90deg, #55d6be, #74a9ff); transition: width .18s ease; }
    .notice { margin-top: 18px; padding: 12px; border-radius: 10px; background: #273650; color: var(--muted); font-size: .9rem; line-height: 1.45; }
    code { color: #8ee7d5; }
  </style>
</head>
<body>
  <main>
    <h1>Snitch Cam</h1>
    <p class="intro">Point your camera at an object to detect whether it is a phone.</p>
    <section class="card">
      <button id="startButton">Start camera</button>
      <p id="status" aria-live="polite">The camera is off.</p>
      <video id="camera" autoplay playsinline muted></video>
      <div id="result" aria-live="polite"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script>
    // Teachable Machine model published for this project.
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/z9G0jONVc/";

    const startButton = document.querySelector('#startButton');
    const video = document.querySelector('#camera');
    const statusText = document.querySelector('#status');
    const result = document.querySelector('#result');
    let model, animationId;

    async function startDetector() {
      startButton.disabled = true;
      statusText.textContent = 'Loading AI model…';
      try {
        model = await tmImage.load(MODEL_URL + 'model.json', MODEL_URL + 'metadata.json');
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        video.srcObject = stream;
        await video.play();
        video.style.display = 'block';
        result.style.display = 'block';
        startButton.style.display = 'none';
        statusText.textContent = 'Camera is running. Show an object to the camera.';
        predict();
      } catch (error) {
        console.error(error);
        statusText.textContent = 'Could not start. Check the model URL and allow camera permission.';
        startButton.disabled = false;
      }
    }

    async function predict() {
      const predictions = await model.predict(video);
      result.innerHTML = predictions.map(item => {
        const percent = (item.probability * 100).toFixed(1);
        return `<div class="row"><div class="label"><span>${item.className}</span><strong>${percent}%</strong></div><div class="track"><div class="bar" style="width:${percent}%"></div></div></div>`;
      }).join('');
      animationId = requestAnimationFrame(predict);
    }

    startButton.addEventListener('click', startDetector);
    window.addEventListener('beforeunload', () => cancelAnimationFrame(animationId));
  </script>
</body>
</html>
